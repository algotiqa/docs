name: Release documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Antora
        run: npm install -g antora@3.2.3

      - name: Build documentation
        run: antora --fetch antora-playbook.yml

      - name: Diagnose deploy token
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          echo "Token length: ${#PAGES_DEPLOY_TOKEN}"
          echo "Authenticated user:"
          curl -sS -H "Authorization: Bearer $PAGES_DEPLOY_TOKEN" \
            https://api.github.com/user | jq -r '.login // .message'
          echo "Repository permissions:"
          curl -sS -o /tmp/repo.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $PAGES_DEPLOY_TOKEN" \
            https://api.github.com/repos/algotiqa/algotiqa.github.io
          jq '{full_name, permissions, message}' /tmp/repo.json 2>/dev/null || cat /tmp/repo.json

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: algotiqa/algotiqa.github.io
          publish_branch: main
          publish_dir: ./build/site
          commit_message: "Deploy docs ${{ github.ref_name }}"
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
